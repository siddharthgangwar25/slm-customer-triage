[project]
name = "triage-training-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "customer-request-triage",
  "torch==2.8.0",
  "transformers==4.57.6",
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "psutil==7.2.2",
  "trl==0.24.0",
  "peft==0.17.1",
]

[tool.uv.sources]
customer-request-triage = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
