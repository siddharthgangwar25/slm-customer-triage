[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "customer-request-triage"
version = "0.1.0"
description = "Reproducible CLINC150 customer-request triage experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "scikit-learn>=1.7,<2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.10,<4",
  "threadpoolctl>=3.6,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-PyYAML>=6,<7", "httpx2"]

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/triage/contracts.py", "src/triage/io.py", "src/triage/evaluation/metrics.py", "src/triage/policy.py", "src/triage/service/schemas.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
